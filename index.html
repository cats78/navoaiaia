<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d"><meta name="description" content="NAVO AI — Your AI. Your next move."><title>NAVO AI</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#17171f;--line:#34333e;--gold:#d8b66a;--muted:#a6a5b1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#f7f5ef;font-family:Inter,Arial,sans-serif;display:flex;flex-direction:column}header{height:70px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #282731}.logo{font-weight:850;font-size:23px;letter-spacing:2px}.logo span,.hero h1 span{color:var(--gold)}.status{font-size:12px;color:#a6e5b8}main{width:min(850px,100%);margin:0 auto;padding:28px 16px 12px;flex:1;display:flex;flex-direction:column}.hero{text-align:center;margin:22px 0 25px}.hero h1{font-size:clamp(34px,7vw,53px);line-height:1.12;margin:0 0 12px;letter-spacing:-1.4px}.hero p{color:var(--muted);line-height:1.6;margin:0}.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;justify-content:center}.suggestions button{background:#14141b;color:#eee;border:1px solid var(--line);padding:10px 13px;border-radius:24px;cursor:pointer}.suggestions button:hover{border-color:var(--gold)}#chat{display:flex;flex-direction:column;gap:14px;padding-bottom:22px}.message{max-width:88%;border-radius:16px;padding:13px 15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:var(--panel);border:1px solid #302f39}.user{align-self:flex-end;background:var(--gold);color:#17130a}.label{font-size:10px;font-weight:800;letter-spacing:1px;opacity:.68;margin-bottom:5px}form{display:flex;gap:9px;padding:9px;background:#14141a;border:1px solid var(--line);border-radius:17px;position:sticky;bottom:10px}input{min-width:0;flex:1;background:transparent;border:0;outline:none;color:white;font-size:16px;padding:10px}form button{border:0;border-radius:12px;background:var(--gold);color:#17130a;font-weight:800;padding:0 18px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.foot{text-align:center;color:#777681;font-size:11px;padding:16px 0 8px}@media(max-width:480px){header{height:62px;padding:0 15px}main{padding:18px 12px 10px}.hero{margin:23px 0}.message{max-width:95%}form button{padding:0 13px}.suggestions{justify-content:flex-start}}
</style></head><body>
<header><div class="logo">NAVO <span>AI</span></div><div class="status">● Chat ready</div></header>
<main><section class="hero"><h1>Your AI.<br><span>Your next move.</span></h1><p>Ask a question, explore an idea, or find information.</p></section>
<div class="suggestions"><button type="button" data-q="Explain artificial intelligence simply">Explain AI</button><button type="button" data-q="Give me ideas for a website">Website ideas</button><button type="button" data-q="Tell me an interesting fact">Interesting fact</button></div>
<section id="chat" aria-live="polite"><div class="message bot"><div class="label">NAVO AI</div>Hey! 👋 I'm NAVO AI. What would you like to explore today?</div></section>
<form id="form"><input id="question" maxlength="2000" autocomplete="off" placeholder="Message NAVO AI..." aria-label="Your message" required><button id="send" type="submit">Send ↑</button></form><div class="foot">NAVO AI · Please verify important information.</div></main>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#question'),chat=document.querySelector('#chat'),send=document.querySelector('#send'),history=[];
function bubble(text,who){const el=document.createElement('div');el.className='message '+who;const label=document.createElement('div');label.className='label';label.textContent=who==='user'?'YOU':'NAVO AI';const body=document.createElement('div');body.textContent=text;el.append(label,body);chat.append(el);el.scrollIntoView({behavior:'smooth',block:'nearest'});return body}
async function ask(q){if(!q.trim()||send.disabled)return;bubble(q,'user');history.push({role:'user',content:q});input.value='';send.disabled=true;send.textContent='...';const out=bubble('Thinking...','bot');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,messages:history.slice(-12)})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Service error');if(typeof data.reply!=='string'||!data.reply.trim())throw Error('Empty reply');out.textContent=data.reply;history.push({role:'assistant',content:data.reply})}catch(e){out.textContent='Sorry, I could not connect to NAVO AI. Please try again.';console.error(e)}finally{send.disabled=false;send.textContent='Send ↑';input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();ask(input.value.trim())});document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>ask(b.dataset.q)));
</script></body></html>
